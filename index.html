<!DOCTYPE html>  <html lang="hi">  
<head>  
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  
  <title>Railway Services - Rajan Sahu</title>  
  <style>  
    :root {  
      --primary: #0a192f;  
      --accent: #ff7700;  
      --accent-glow: rgba(255, 119, 0, 0.4);  
      --card-bg: rgba(255, 255, 255, 0.12);  
      --card-border: rgba(255, 255, 255, 0.22);  
      --text-white: #ffffff;  
      --text-muted: #cbd5e1;  
    }  * {  
  box-sizing: border-box;  
  margin: 0;  
  padding: 0;  
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;  
}  

/* --- शानदार डायनामिक बैकग्राउंड --- */  
body {  
  min-height: 100vh;  
  display: flex;  
  justify-content: center;  
  align-items: center;  
  padding: 20px;  
  background: radial-gradient(circle at 15% 20%, #1e3a8a 0%, #0b192c 45%, #050b14 100%);  
  overflow-x: hidden;  
  position: relative;  
}  

/* बैकग्राउंड फ्लोटिंग ग्लो इफ़ेक्ट */  
body::before, body::after {  
  content: '';  
  position: absolute;  
  border-radius: 50%;  
  filter: blur(80px);  
  z-index: 0;  
  pointer-events: none;  
  opacity: 0.6;  
  animation: floatOrbs 10s ease-in-out infinite alternate;  
}  
body::before {  
  width: 320px;  
  height: 320px;  
  background: #ff7700;  
  top: 10%;  
  left: 15%;  
}  
body::after {  
  width: 380px;  
  height: 380px;  
  background: #0284c7;  
  bottom: 10%;  
  right: 15%;  
  animation-delay: -5s;  
}  

@keyframes floatOrbs {  
  0% { transform: translateY(0px) scale(1); }  
  100% { transform: translateY(40px) scale(1.15); }  
}  

/* --- मुख्य ऐप कार्ड (App Container) --- */  
.container {  
  position: relative;  
  z-index: 1;  
  background: var(--card-bg);  
  backdrop-filter: blur(25px);  
  -webkit-backdrop-filter: blur(25px);  
  border: 1px solid var(--card-border);  
  padding: 35px 25px;  
  border-radius: 24px;  
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);  
  max-width: 430px;  
  width: 100%;  
  text-align: center;  
  transition: transform 0.3s ease;  
}  

.badge {  
  display: inline-block;  
  padding: 5px 14px;  
  background: rgba(255, 119, 0, 0.2);  
  border: 1px solid rgba(255, 119, 0, 0.4);  
  color: #ff9d42;  
  border-radius: 20px;  
  font-size: 0.78rem;  
  font-weight: 700;  
  letter-spacing: 1px;  
  text-transform: uppercase;  
  margin-bottom: 12px;  
}  

h1 {  
  color: var(--text-white);  
  font-size: 1.8rem;  
  font-weight: 800;  
  letter-spacing: -0.5px;  
  margin-bottom: 6px;  
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);  
}  

p.subtitle {  
  color: var(--text-muted);  
  font-size: 0.9rem;  
  margin-bottom: 28px;  
}  

/* बटन ग्रुप */  
.btn-group {  
  display: flex;  
  flex-direction: column;  
  gap: 14px;  
}  

/* बटन की प्रारंभिक स्थिति (पॉपअप हटने से पहले छुपे रहेंगे) */  
.btn {  
  display: flex;  
  align-items: center;  
  justify-content: space-between;  
  padding: 16px 20px;  
  font-size: 1.02rem;  
  font-weight: 600;  
  border-radius: 16px;  
  background: rgba(255, 255, 255, 0.08);  
  border: 1px solid rgba(255, 255, 255, 0.15);  
  color: #ffffff;  
  cursor: pointer;  
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);  
    
  /* स्टैगर्ड एनिमेशन के लिए डिफॉल्ट हाइड */  
  opacity: 0;  
  transform: translateY(35px) scale(0.95);  
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);  
}  

/* बटन होवर इफ़ेक्ट */  
.btn:hover {  
  background: linear-gradient(135deg, rgba(255, 119, 0, 0.9), rgba(255, 85, 0, 0.85));  
  border-color: #ffaa5a;  
  transform: translateY(-3px) scale(1.02) !important;  
  box-shadow: 0 10px 25px var(--accent-glow);  
}  

.btn .icon {  
  font-size: 1.4rem;  
  background: rgba(255, 255, 255, 0.15);  
  width: 40px;  
  height: 40px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
  border-radius: 10px;  
  transition: transform 0.3s;  
}  

.btn:hover .icon {  
  transform: scale(1.15) rotate(5deg);  
  background: rgba(255, 255, 255, 0.25);  
}  

/* --- पॉपअप हटने के बाद एक-एक करके आने वाला क्लास --- */  
.btn.show {  
  opacity: 1;  
  transform: translateY(0) scale(1);  
}  

/* --- प्रीमियम लॉक्ड पॉपअप (MODAL) --- */  
.modal-overlay {  
  position: fixed;  
  inset: 0;  
  background: rgba(3, 7, 18, 0.78);  
  backdrop-filter: blur(14px);  
  -webkit-backdrop-filter: blur(14px);  
  display: flex;  
  justify-content: center;  
  align-items: center;  
  z-index: 99999;  
  transition: opacity 0.5s ease, visibility 0.5s ease;  
}  

/* पॉपअप बॉक्स */  
.modal-box {  
  background: linear-gradient(145deg, rgba(20, 35, 60, 0.95), rgba(10, 18, 32, 0.98));  
  border: 1px solid rgba(255, 150, 50, 0.35);  
  width: 90%;  
  max-width: 360px;  
  padding: 35px 25px;  
  border-radius: 28px;  
  text-align: center;  
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 119, 0, 0.2);  
  animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);  
  position: relative;  
}  

@keyframes popBounce {  
  from { transform: scale(0.7); opacity: 0; }  
  to { transform: scale(1); opacity: 1; }  
}  

.modal-box h2 {  
  color: #94a3b8;  
  font-size: 1.1rem;  
  letter-spacing: 2px;  
  text-transform: uppercase;  
  margin-bottom: 5px;  
}  

.modal-box .user-name {  
  font-size: 1.8rem;  
  font-weight: 800;  
  color: #fff;  
  background: linear-gradient(90deg, #ff9933, #ffffff, #138808);  
  -webkit-background-clip: text;  
  -webkit-text-fill-color: transparent;  
  margin-bottom: 8px;  
}  

.modal-box .msg {  
  color: #cbd5e1;  
  font-size: 0.92rem;  
  margin-bottom: 22px;  
}  

/* सर्कुलर प्रोग्रेस टाइमर */  
.timer-wrapper {  
  position: relative;  
  width: 90px;  
  height: 90px;  
  margin: 0 auto 16px auto;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
}  

.timer-wrapper svg {  
  position: absolute;  
  top: 0;  
  left: 0;  
  width: 100%;  
  height: 100%;  
  transform: rotate(-90deg);  
}  

.timer-wrapper circle {  
  fill: none;  
  stroke-width: 6;  
  stroke-linecap: round;  
}  

.timer-bg {  
  stroke: rgba(255, 255, 255, 0.1);  
}  

.timer-bar {  
  stroke: var(--accent);  
  stroke-dasharray: 251.2;  
  stroke-dashoffset: 0;  
  transition: stroke-dashoffset 1s linear;  
  filter: drop-shadow(0 0 6px var(--accent));  
}  

.timer-number {  
  font-size: 2rem;  
  font-weight: 800;  
  color: #ffffff;  
}  

.wait-text {  
  font-size: 0.85rem;  
  color: #94a3b8;  
}

  </style>  
</head>  
<body>    <!-- 10 SECONDS LOCKED POPUP -->    <div id="welcomeModal" class="modal-overlay">  
    <div class="modal-box">  
      <h2>Welcome</h2>  
      <div class="user-name">Rajan Sahu</div>  
      <p class="msg">Railway Portal लोड हो रहा है...</p>  <!-- सर्कुलर टाइमर -->  
  <div class="timer-wrapper">  
    <svg viewBox="0 0 90 90">  
      <circle class="timer-bg" cx="45" cy="45" r="38"></circle>  
      <circle id="progressCircle" class="timer-bar" cx="45" cy="45" r="38"></circle>  
    </svg>  
    <span class="timer-number" id="timer">10</span>  
  </div>  
    
  <p class="wait-text">कृपया 10 सेकंड प्रतीक्षा करें...</p>  
</div>

  </div>    <!-- MAIN DASHBOARD -->    <div class="container">  
    <span class="badge">Official Portal</span>  
    <h1>🚆 Railway Services</h1>  
    <p class="subtitle">Quick & Easy Indian Railway Services</p>  <div class="btn-group">  
  <!-- 1. TICKET BOOK (IRCTC) -->  
  <button class="btn" onclick="openIRCTC()">  
    <span>Book Ticket</span>  
    <span class="icon">🎫</span>  
  </button>  

  <!-- 2. LIVE TRACK (NTES) -->  
  <button class="btn" onclick="openNTES()">  
    <span>Live Train Tracking</span>  
    <span class="icon">📍</span>  
  </button>  

  <!-- 3. PNR CHECK (ConfirmTkt) -->  
  <button class="btn" onclick="openConfirmTkt()">  
    <span>Check PNR Status</span>  
    <span class="icon">🔍</span>  
  </button>  

  <!-- 4. TRAINS LIST (RailYatri) -->  
  <button class="btn" onclick="openRailYatri()">  
    <span>Trains Between Stations</span>  
    <span class="icon">🚆</span>  
  </button>  
</div>

  </div>    <script>  
    // --- 10 SECONDS STRICT TIMER WITH PROGRESS RING ---  
    const totalTime = 10;  
    let timeLeft = totalTime;  
    const timerDisplay = document.getElementById("timer");  
    const modal = document.getElementById("welcomeModal");  
    const progressCircle = document.getElementById("progressCircle");  
    const buttons = document.querySelectorAll(".btn");  
  
    // Circumference of r=38 circle: 2 * PI * 38 ≈ 238.76  
    const circumference = 2 * Math.PI * 38;  
    progressCircle.style.strokeDasharray = circumference;  
  
    const countdown = setInterval(() => {  
      timeLeft--;  
      if (timerDisplay) {  
        timerDisplay.textContent = timeLeft;  
      }  
  
      // सर्कुलर प्रोग्रेस बार अपडेट  
      const offset = circumference - (timeLeft / totalTime) * circumference;  
      progressCircle.style.strokeDashoffset = offset;  
        
      // टाइमर खत्म होने पर  
      if (timeLeft <= 0) {  
        clearInterval(countdown);  
          
        // पॉपअप को स्मूथली ज़ूम-आउट करके फेड करना  
        modal.style.opacity = "0";  
        modal.style.transform = "scale(1.05)";  
          
        setTimeout(() => {  
          modal.style.display = "none";  
          // पॉपअप हटने के बाद बटन एक-एक करके (Cascade) आएंगे  
          animateButtonsOneByOne();  
        }, 500);  
      }  
    }, 1000);  
  
    // --- एक-एक करके बटन्स दिखाने का फंक्शन ---  
    function animateButtonsOneByOne() {  
      buttons.forEach((btn, index) => {  
        setTimeout(() => {  
          btn.classList.add("show");  
        }, index * 160); // हर 160ms के अंतर पर एक बटन स्लाइड होकर आएगा  
      });  
    }  
  
    // --- BUTTON LINKS ---  
    function openIRCTC() {  
      window.open("https://www.irctc.co.in/nget/train-search", "_blank", "noopener,noreferrer");  
    }  
  
    function openNTES() {  
      window.open("https://enquiry.indianrail.gov.in/mntes/", "_blank", "noopener,noreferrer");  
    }  
  
    function openConfirmTkt() {  
      window.open("https://www.confirmtkt.com/pnr-status", "_blank", "noopener,noreferrer");  
    }  
  
    function openRailYatri() {  
      window.open("https://www.railyatri.in/trains-between-stations", "_blank", "noopener,noreferrer");  
    }  
  </script>  </body>  
</html>
